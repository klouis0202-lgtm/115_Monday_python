<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>註冊｜麻將戰績簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-800">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
      <section class="w-full rounded-3xl border border-stone-200 bg-white p-8 shadow-sm">
        <a href="{% url 'chess:room-list' %}" class="text-sm font-bold text-blue-600">
          ← 回到我的房間
        </a>

        <h1 class="mt-6 text-3xl font-black">建立帳號</h1>
        <p class="mt-3 text-stone-500">建立帳號後，就能開始記錄自己的麻將房間。</p>

        <form method="post" action="{% url 'account_signup' %}" class="mt-8 space-y-4">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="w-full rounded-xl bg-blue-600 px-5 py-3 font-bold text-white">
            註冊
          </button>
        </form>

        <p class="mt-6 text-sm text-stone-500">
          已經有帳號？
          <a href="{% url 'account_login' %}" class="font-bold text-blue-600">登入</a>
        </p>
      </section>
    </main>
  </body>
</html>
