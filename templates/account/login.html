<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登入｜ChessOracle</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-800">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
      <section class="w-full rounded-3xl border border-stone-200 bg-white p-8 shadow-sm">
        <a href="{% url 'chess:room-list' %}" class="text-sm font-bold text-blue-600">
          ← 回到我的房間
        </a>

        <h1 class="mt-6 text-3xl font-black">登入</h1>
        <p class="mt-3 text-stone-500">登入後即可使用你的帳號。</p>

        <form method="post" action="{% url 'account_login' %}" class="mt-8 space-y-4">
          {% csrf_token %}
          {% if redirect_field_value %}<input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">{% endif %}
          {{ form.as_p }}
          <button type="submit" class="w-full rounded-xl bg-blue-600 px-5 py-3 font-bold text-white">
            登入
          </button>
        </form>

        <p class="mt-6 text-sm text-stone-500">
          還沒有帳號？
          <a href="{% url 'account_signup' %}{% if redirect_field_value %}?{{ redirect_field_name }}={{ redirect_field_value|urlencode }}{% endif %}" class="font-bold text-blue-600">註冊</a>
        </p>
      </section>
    </main>
  </body>
</html>
