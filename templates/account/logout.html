<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登出｜ChessOracle</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-800">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
      <section class="w-full rounded-3xl border border-stone-200 bg-white p-8 shadow-sm">
        <a href="{% url 'chess:room-list' %}" class="text-sm font-bold text-blue-600">
          ← 回到我的房間
        </a>

        <h1 class="mt-6 text-3xl font-black">登出帳號</h1>
        <p class="mt-3 text-stone-500">確定要登出目前帳號嗎？</p>

        <form method="post" action="{% url 'account_logout' %}" class="mt-8">
          {% csrf_token %}
          <button type="submit" class="w-full rounded-xl bg-stone-800 px-5 py-3 font-bold text-white">
            登出
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
