<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ group.name }}｜ChessOracle</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#f7f3ea;color:#292929;font-family:system-ui,"Microsoft JhengHei",sans-serif}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}.card{background:#fffdf8;border:1px solid #ddd7cc;box-shadow:0 12px 36px #37302608}</style></head><body><main class="mx-auto max-w-4xl px-6 py-12 sm:py-20"><a href="{% url 'chess:group-list' %}" class="text-sm font-semibold text-blue-600">← 返回我的群組</a><header class="mt-6"><p class="text-sm font-bold tracking-widest text-blue-600">ChessOracle · 群組</p><h1 class="mt-3 break-words text-3xl font-bold sm:text-5xl">{{ group.name }}</h1><p class="mt-3 text-stone-500">建立於 {{ group.created_at|date:"Y/m/d H:i" }} · {{ rooms|length }} 間房間</p></header><h2 class="mt-8 text-xl font-bold">群組內的房間</h2><section class="mt-5 space-y-4">{% for room in rooms %}<a href="{% url 'chess:room-detail' room.id %}" class="card flex items-center justify-between gap-4 rounded-2xl p-6 hover:border-blue-300"><div class="min-w-0"><h3 class="break-words text-xl font-bold">{{ room.name }}</h3><p class="mt-2 text-sm text-stone-500">房間代碼：{{ room.code }}</p></div><span aria-hidden="true">→</span></a>{% empty %}<div class="rounded-2xl border border-dashed border-stone-300 p-8 text-center"><p>此群組尚無房間。</p><p class="mt-2 text-sm text-stone-500">建立房間時，選擇「{{ group.name }}」即可加入。</p></div>{% endfor %}</section><div class="mt-8"><a href="{% url 'chess:room-create' %}" class="inline-flex rounded-full bg-blue-600 px-6 py-3 font-bold text-white">＋ 建立房間</a></div></main></body></html>
