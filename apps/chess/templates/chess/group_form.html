<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>建立群組｜ChessOracle</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f7f3ea;color:#292929;font-family:system-ui,"Microsoft JhengHei",sans-serif}select,input[type=text]{width:100%;border:1px solid #d6d3d1;border-radius:12px;padding:12px;background:white}label{font-weight:600}.errorlist{color:#b91c1c;font-size:14px;margin:8px 0}p:has(input){margin:16px 0}button:focus-visible,a:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}</style></head><body><main class="mx-auto max-w-4xl px-6 py-12 sm:py-20">
<a href="{% url 'chess:room-list' %}" class="text-sm font-semibold text-blue-600">← 回到我的房間</a>
<section class="mt-6 rounded-3xl border border-stone-200 bg-white p-6 sm:p-10"><h1 class="text-3xl font-bold">建立群組</h1><p class="mt-3 text-stone-500">用群組整理你的分析房間；一個群組可收納多個房間。</p><form method="post" action="{% url 'chess:group-create' %}" class="mt-8 space-y-5">{% csrf_token %}{{ form.as_p }}<button type="submit" class="rounded-full bg-blue-600 px-6 py-3 font-bold text-white">建立群組</button></form></section></main></body></html>
