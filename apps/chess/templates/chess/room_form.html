<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>建立房間｜麻將戰績簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-800">
    <main class="mx-auto max-w-xl px-6 py-16">
      <a href="{% url 'chess:room-list' %}" class="text-sm font-semibold text-stone-500 hover:text-blue-600">← 回到房間列表</a>
      <section class="mt-6 rounded-3xl border border-stone-200 bg-white p-6 shadow-sm sm:p-10">
        <p class="text-sm font-bold tracking-[.16em] text-blue-600">NEW ROOM</p>
        <h1 class="mt-3 text-3xl font-black">建立麻將房間</h1>

        {% if error %}
          <p class="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700">{{ error }}</p>
        {% endif %}

        <form method="post" action="{% url 'chess:room-create' %}" class="mt-8 space-y-6">
          {% csrf_token %}

          <div>
            <label for="name" class="text-sm font-bold">房間名稱</label>
            <input id="name" name="name" type="text" value="{{ name|default:'' }}" placeholder="例：xxx麻將之夜" maxlength="100" required
                   class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
          </div>

          <div>
            <label for="code" class="text-sm font-bold">房間代碼</label>
            <input id="code" name="code" type="text" value="{{ code|default:'' }}" maxlength="12" required
                   class="mt-2 w-full rounded-xl border border-stone-300 px-4 py-3 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">
          </div>

          <fieldset>
            <legend class="text-sm font-bold">麻將規則（可複選）</legend>
            <div class="mt-3 space-y-3">
              {% for rule in rules %}
                <label class="flex items-center gap-3 rounded-xl border border-stone-200 px-4 py-3">
                  <input name="rules" type="checkbox" value="{{ rule.id }}" {% if rule.id|stringformat:"s" in selected_rule_ids %}checked{% endif %}>
                  <span class="text-sm font-medium">{{ rule.name }}</span>
                </label>
              {% empty %}
                <p class="text-sm text-stone-500">目前尚未建立麻將規則。</p>
              {% endfor %}
            </div>
          </fieldset>

          <button type="submit" class="w-full rounded-full bg-blue-600 px-5 py-3 font-bold text-white hover:bg-blue-700">
            建立房間
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
